services:
  pairflow:
    image: ${PAIRFLOW_DEVCONTAINER_IMAGE:-ghcr.io/tbitu/pairflow-devcontainer:latest}
    container_name: pairflow-devcontainer
    restart: unless-stopped
    stdin_open: true
    security_opt:
      - label:disable
    volumes:
      - ..:/workspace:z
      - pairflow-worktrees:/.pairflow-worktrees
      - pairflow-reasonix-state:/home/vscode/.reasonix
      - pairflow-opencode-state:/home/vscode/.config/opencode
      - pairflow-opencode-home:/home/vscode/.opencode
      - pairflow-npm-cache:/home/vscode/.npm
      - pairflow-pnpm-store:/home/vscode/.local/share/pnpm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - UPSTREAM_URL=${PAIRFLOW_OPENAI_ENDPOINT:-http://host.docker.internal:11434/v1}
      - TARGET_MODEL=${PAIRFLOW_TARGET_MODEL:-qwen3.8-27b:q8_0}
      - BACKEND=${PAIRFLOW_BACKEND:-ollama}
      - UPSTREAM_API_KEY=${PAIRFLOW_UPSTREAM_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    command: /bin/bash -c "/usr/local/bin/init-container.sh && /usr/local/bin/start-services.sh && sleep infinity"

  ollama:
    image: ollama/ollama:latest
    container_name: pairflow-ollama
    profiles: ["with-ollama"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - pairflow-ollama-models:/root/.ollama

volumes:
  pairflow-worktrees:
  pairflow-reasonix-state:
  pairflow-opencode-state:
  pairflow-opencode-home:
  pairflow-npm-cache:
  pairflow-pnpm-store:
  pairflow-ollama-models:
