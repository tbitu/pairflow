[validation]
required = ["lint", "typecheck", "fitness"]
meta_review_approve_required = ["test"]

[validation.commands]
lint = "pnpm lint"
typecheck = "pnpm typecheck"
test = "pnpm test"
fitness = "pnpm fitness:check:ci"
bootstrap = "pnpm install --frozen-lockfile && pnpm --dir ui install --frozen-lockfile && pnpm build"

[defaults.agents]
reviewer = "opencode"
reviewer_model = "pairflow-reviewer"
implementer = "opencode"
implementer_model = "pairflow-implementer"
meta_reviewer = "opencode"
meta_reviewer_model = "pairflow-meta-reviewer"

[plan_watch.runner]
backend = "opencode"
idle_timeout_seconds = 1800
