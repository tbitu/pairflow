[validation]
required = ["lint", "typecheck", "fitness"]
meta_review_approve_required = ["test"]

[validation.commands]
lint = "pnpm lint"
typecheck = "pnpm typecheck"
test = "pnpm test"
fitness = "pnpm fitness:check:ci"
bootstrap = "pnpm install --frozen-lockfile && pnpm --dir ui install --frozen-lockfile && pnpm build"

[defaults.agents]
reviewer = "codex"
reviewer_model = "qwen3.6-35b-a3b-mtp@q6_k_xl-reviewer"
implementer = "codex"
implementer_model = "qwen3.6-35b-a3b-mtp@q6_k_xl-implementer"
meta_reviewer = "codex"
meta_reviewer_model = "qwen3.6-35b-a3b-mtp@q6_k_xl-reviewer"

[plan_watch.runner]
backend = "codex"
idle_timeout_seconds = 900
